name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SERVER_IMAGE_LATEST: ghcr.io/${{ github.repository_owner }}/server:latest
  CLIENT_IMAGE_LATEST: ghcr.io/${{ github.repository_owner }}/client:latest
  SERVER_IMAGE_SHA: ghcr.io/${{ github.repository_owner }}/server:${{ github.sha }}
  CLIENT_IMAGE_SHA: ghcr.io/${{ github.repository_owner }}/client:${{ github.sha }}

jobs:
  client-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: |
          cd client
          npm ci
      - name: Lint client
        run: |
          cd client
          npm run lint

  client-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: |
          cd client
          npm ci
      - name: Test client
        run: |
          cd client
          npm test

  server-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: |
          cd server
          npm ci
      - name: Lint server
        run: |
          cd server
          npm run lint

  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: |
          cd server
          npm ci
      - name: Test server
        run: |
          cd server
          npm test

  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: |
          cd client
          npm ci
      - name: Build client
        run: |
          cd client
          npm run build
      - name: Install Playwright browsers
        run: |
          cd client
          npx playwright install --with-deps
      - name: Run E2E tests
        run: |
          cd client
          npm start &
          npx wait-on http://localhost:3000
          npm run test:e2e -- --browser=${{ matrix.browser }}
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            client/playwright-report
            client/test-results

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [client-lint, client-test, server-lint, server-test, e2e]
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push server image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/garage-sale-server:latest
      - name: Build and push client image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/garage-sale-client:latest
