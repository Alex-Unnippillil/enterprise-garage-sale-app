name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SERVER_IMAGE_LATEST: ghcr.io/${{ github.repository_owner }}/server:latest
  CLIENT_IMAGE_LATEST: ghcr.io/${{ github.repository_owner }}/client:latest
  SERVER_IMAGE_SHA: ghcr.io/${{ github.repository_owner }}/server:${{ github.sha }}
  CLIENT_IMAGE_SHA: ghcr.io/${{ github.repository_owner }}/client:${{ github.sha }}

jobs:
  client-lint:
    permissions: { contents: read }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: |
          cd client
          npm ci
      - name: Lint client
        run: |
          cd client
          npm run lint

  client-test:
    permissions: { contents: read }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: |
          cd client
          npm ci
      - name: Test client
        run: |
          cd client
          npm test


    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: |
          cd client
          npm ci
      - name: Lint client dependencies
        run: |
          cd client
          npm run lint:deps

  server-lint:
    permissions: { contents: read }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: |
          cd server
          npm ci
      - name: Lint server
        run: |
          cd server
          npm run lint

  server-test:
    permissions: { contents: read }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: |
          cd server
          npm ci
      - name: Test server
        run: |
          cd server
          npm test


    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: |
          cd server
          npm ci
      - name: Lint server dependencies
        run: |
          cd server
          npm run lint:deps

  e2e:
    permissions: { contents: read }
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: |
          cd client
          npm ci
      - name: Build client
        run: |
          cd client
          npm run build
      - name: Install Playwright browsers
        run: |
          cd client
          npx playwright install --with-deps
      - name: Run E2E tests
        run: |
          cd client
          npm start &


  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions: { contents: read }
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.1.1
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push server image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/garage-sale-server:latest
      - name: Build and push client image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/garage-sale-client:latest
